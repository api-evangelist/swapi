apis:
- name: SWAPI REST API (swapi.tech)
  description: >-
    The Node/MongoDB community rebuild of SWAPI, maintained by @semperry at swapi.tech. Wraps the canonical
    SWAPI payloads inside `result.properties` envelopes and adds Discord/Reddit community surfaces. Exposes
    the same six top-level resources (films, people, planets, species, starships, vehicles).
